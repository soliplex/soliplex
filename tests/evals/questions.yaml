# LLM Documentation Comprehension Evaluation
#
# This file contains questions to test whether an LLM can effectively
# use the Soliplex documentation to answer common developer questions.
#
# Format:
#   question: The question an agent might ask
#   expected_topics: Keywords/concepts a correct answer should mention
#   source_file: Which llms file contains the answer
#   difficulty: easy | medium | hard

project:
  - question: "What is Soliplex and what are its main components?"
    expected_topics: ["RAG", "FastAPI", "Flutter", "backend", "frontend"]
    source_file: "llms-project-full.txt"
    difficulty: easy

  - question: "How do I install and set up the Soliplex server?"
    expected_topics: ["Python", "pip install", "venv", "clone", "environment"]
    source_file: "llms-project-full.txt"
    difficulty: easy

  - question: "What authentication system does Soliplex use?"
    expected_topics: ["OIDC", "Keycloak", "authentication"]
    source_file: "llms-project-full.txt"
    difficulty: medium

  - question: "How do I configure a new room in Soliplex?"
    expected_topics: ["room", "config", "yaml", "installation"]
    source_file: "llms-project-full.txt"
    difficulty: medium

  - question: "What LLM providers does Soliplex support?"
    expected_topics: ["OpenAI", "Ollama", "model", "provider"]
    source_file: "llms-project-full.txt"
    difficulty: easy

  - question: "How do I set up RAG document indexing?"
    expected_topics: ["RAG", "document", "index", "retrieval"]
    source_file: "llms-project-full.txt"
    difficulty: medium

  - question: "What environment variables are required for the server?"
    expected_topics: ["env", "OPENAI", "API_KEY", "secrets"]
    source_file: "llms-project-full.txt"
    difficulty: medium

  - question: "How do I run the Flutter client locally?"
    expected_topics: ["Flutter", "flutter run", "web", "client"]
    source_file: "llms-project-full.txt"
    difficulty: easy

  - question: "What is the architecture of Soliplex?"
    expected_topics: ["backend", "frontend", "FastAPI", "Flutter", "configuration"]
    source_file: "llms-project-full.txt"
    difficulty: easy

  - question: "How do I configure secrets in Soliplex?"
    expected_topics: ["secrets", "env", "resolve", "config"]
    source_file: "llms-project-full.txt"
    difficulty: medium

