[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "soliplex"
version = "0.73"
description = "An AI-powered Retrieval-Augmented Generation (RAG) system with a modern web interface."
authors = [{ name = "Enfold", email = "info@enfoldsystems.net" }]
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "ag-ui-protocol >= 0.1.18, < 0.1.19",
    "aiohttp >= 3.14.1, < 3.15",  # multiple CVEs
    "aiosqlite",
    "alembic >= 1.18.4, < 1.19",
    "authlib",
    "bubble-sandbox >= 0.10.0, < 0.11",
    "cryptography >= 49.0.0",  # GHSA-537c-gmf6-5ccf
    "fastapi",
    "fastmcp >= 3.3.0, < 3.4",
    "fakeredis != 2.35.0",  # brownbag
    "greenlet",
    "haiku.rag-slim >= 0.67, < 0.68",
    "haiku-skills >= 0.18.1, < 0.19",
    "idna >= 3.15",
    "itsdangerous",
    "joserfc >= 1.6.7, < 1.7",  # CVE-2026-48990
    "jsonpatch",
    "pillow >= 12.3.0, < 12.4",  # PYSEC-2026-225{3,4,5,6,7}
    "python-jsonpath",  # RFC 9535 query support
    "python-multipart >= 0.0.31",  # Multiple CVEs
    "jwcrypto",
    "logfire[fastapi]",
    "pydantic-ai-slim[google] >= 1.102.0, < 2.0",  # CVE-2026-48782
    "pydantic-settings >= 2.14.2, < 2.15",  # GHSA-4xgf-cpjx-pc3j
    "pyjwt >= 2.13.0, < 2.14",  # PYSEC-2026-{175,177,178,179}
    "pymdown-extensions != 10.21.2",  # CVE-2026-46338
    "python-keycloak",
    "sqlmodel",
    "starlette >= 1.3.1",  # Multiple CVEs
    "uvicorn[standard]",
    "certifi >= 2025.11.12",
]

[project.scripts]
soliplex-cli = "soliplex.cli.main:the_cli"
soliplex-tui = "soliplex.tui.cli:the_cli"
soliplex-tui-serve = "soliplex.tui.serve:the_cli"

[dependency-groups]
dev = [
    "anyio >= 4.12.1, < 4.13",
    "coverage >= 7.13.5, < 7.14",
    "pytest >= 9.0.2, < 9.1",
    "pytest-cov >= 7.0.0, < 7.1",
    "pytest-asyncio >= 1.3.0, < 1.4",
    "pytest-xdist >= 3.8.0, < 3.9",
    "ruff >= 0.15.6, < 0.16",
    "soliplex-skills >= 0.6",
]
docs = [
    "zensical>=0.0.43",
]
postgres = [
    "psycopg[binary]",  # synchronous access
    "asyncpg",          # async access
]
tui = [
    "textual",
    "textual-serve",
    "textual-fspicker",
    "typer",
]

[tool.pytest.ini_options]
pythonpath = [".", "tests/unit"]
python_files = "test_*.py"
# skip 'tests/functional' by default
testpaths = ["tests/unit"]
addopts = "--cov=soliplex --cov=tests/unit --cov=scripts --cov=skills/soliplex-docs/scripts --cov-branch --cov-fail-under=100"
filterwarnings = [
    # "ignore::DeprecationWarning:<source-package>",
]
markers = [
    "needs_llm: functest requiring an LLM",
]

[tool.coverage.run]
omit = [
    "src/soliplex/cli/__init__.py",
    "src/soliplex/tui.py",
]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 79
exclude = [
]
target-version = "py313"

[tool.ruff.lint]
select = [
    # flake8
    "F",
    # pycodestyle
    "E",
    # flake8-bugbear
    "B",
    # pyupgrade
    "U",
    # isort
    "I",
    # pandas vet
    "PD",
    # tryceratops
    "TRY",
    # flake8-pytest-style
    "PT",
]
ignore = [
    "PT019",  # incorrecly flags '@mock.patch' args as fixtures
]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.flake8-pytest-style]
parametrize-names-type = "csv"

[tool.pymarkdown]
extensions.front-matter.enabled = true
plugins.line-length.enabled = false             # md013
plugins.no-duplicate-heading.enabled = false    # md024
plugins.no-inline-html.enabled = false          # md033
plugins.no-emphasis-as-heading.enabled = false  # md036
plugins.first-line-heading.enabled = false      # md041
plugins.code-block-style.enabled = false        # md046
# There is no rule 'md060'
# plugins.md060.enabled = false                 # md060


# Lets the `soliplex-skills` console script (and CI) manage the published
# `soliplex-docs` skill without repeating these constants on the command line.
# The bundled scripts/skill_versions.py hardcodes the same values, since it
# cannot read this file once the skill is installed elsewhere.
[[tool.soliplex-skills.skill]]
name = "soliplex-docs"
owner = "soliplex"
repo = "soliplex"
asset_tarball = "soliplex-docs-skill.tar.gz"
pointer_tag = "docs-latest"
rolling_prefix = "docs"


[tool.alembic]


# template used to generate migration file names; The default value is %%(rev)s_%%(slug)s
# Uncomment the line below if you want the files to be prepended with date and time
# see https://alembic.sqlalchemy.org/en/latest/tutorial.html#editing-the-ini-file
# for all available tokens
# file_template = "%%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s"
# Or organize into date-based subdirectories (requires recursive_version_locations = true)
# file_template = "%%(year)d/%%(month).2d/%%(day).2d_%%(hour).2d%%(minute).2d_%%(second).2d_%%(rev)s_%%(slug)s"

# additional paths to be prepended to sys.path. defaults to the current working directory.
prepend_sys_path = [
    "."
]

# timezone to use when rendering the date within the migration file
# as well as the filename.
# If specified, requires the tzdata library which can be installed by adding
# `alembic[tz]` to the pip requirements.
# string value is passed to ZoneInfo()
# leave blank for localtime
# timezone =

# max length of characters to apply to the "slug" field
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions in the
# versions/ directory
# sourceless = false

# version location specification; This defaults
# to <script_location>/versions.  When using multiple version
# directories, initial revisions must be specified with --version-path.
# version_locations = [
#    "%(here)s/alembic/versions",
#    "%(here)s/foo/bar"
# ]


# set to 'true' to search source files recursively
# in each "version_locations" directory
# new in Alembic version 1.10
# recursive_version_locations = false

# the output encoding used when revision files
# are written from script.py.mako
# output_encoding = "utf-8"

# This section defines scripts or Python functions that are run
# on newly generated revision scripts.  See the documentation for further
# detail and examples
[[tool.alembic.post_write_hooks]]
# Alternatively, use the exec runner to execute a binary found on your PATH
name = "ruff"
type = "exec"
executable = "ruff"
options = "check --fix REVISION_SCRIPT_FILENAME"
