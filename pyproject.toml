[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "soliplex"
version = "0.30dev0"
description = "An AI-powered Retrieval-Augmented Generation (RAG) system with a modern web interface."
authors = [{ name = "Enfold", email = "info@enfoldsystems.net" }]
readme = "README.md"
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "ag-ui-protocol >= 0.1.10",
    "aiosqlite<0.22.0",
    "authlib",
    "fastapi[standard]>=0.125.0",
    "fastmcp >= 2.13.0.2, < 2.14",
    "greenlet",
    "haiku.rag-slim >= 0.23.0",
    "itsdangerous",
    "jsonpatch",
    "jwcrypto",
    "logfire[fastapi]",
    "pyjwt",
    "python-keycloak",
    "sqlmodel>=0.0.27",
    "starlette",
    "trio",
    "uvicorn[standard]",
    "certifi >= 2025.11.12",
    "typer>=0.19.2",
]

[project.scripts]
soliplex-cli = "soliplex.cli:the_cli"
soliplex-tui = "soliplex.tui.cli:the_cli"
soliplex-tui-serve = "soliplex.tui.serve:main"
si-cli = "soliplex.ingester.cli:app"
si-agent = "soliplex.ingester.agents.cli:cli"



[dependency-groups]
dev = [
    "anyio",
    "coverage>=7.11.0",
    "duckdb>=1.4.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-env>=1.2.0",
    "ruff>=0.14.10",
    "trio",
]

docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.19",
    # See https://github.com/mkdocs/mkdocs/issues/4032
    "click != 8.2.2, != 8.3.0",
]
postgres = [
    "asyncpg",
]
tui = [
    "textual",
    "textual-serve",
    
]

ingester=[
    "aiofiles>=25.1.0",
    "aiohttp>=3.13.2",
    "alembic>=1.17.2",
    "async-lru>=2.0.5",
    "fsspec>=2025.12.0",
    "opendal>=0.40.0",
    "pdf-splitter",
    "psycopg[binary,pool]>=3.3.2",
    "pydantic-settings>=2.12.0",
    "pypdf>=6.4.2",
    "tenacity>=9.1.2",
    "websockets>=15.0.1",
]

agents=[
    "aiofiles>=25.1.0",
    "aiohttp>=3.13.2",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.12.0",
]

[tool.pytest.ini_options]
pythonpath = "."
python_files = "test_*.py"
# skip 'tests/functional' by default
testpaths = ["tests/unit"]
addopts = "--cov=soliplex --cov=tests/unit --cov-branch --cov-fail-under=100"
filterwarnings = [
    # "ignore::DeprecationWarning:<source-package>",
]
markers = [
    "needs_llm: functest requiring an LLM",
]

[tool.pytest_env]
DOC_DB_URL = "sqlite+aiosqlite:///:memory:"
FILE_STORE_TARGET="db"
FILE_STORE_DIR="./file-store"
LANCEDB_DIR="./lancedb"
DOCLING_SERVER_URL="http://localhost:5004/v1"

[tool.coverage.run]
omit = [
    "src/soliplex/cli.py",
    "src/soliplex/examples.py",
    "src/soliplex/tui.py",
]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 79
exclude = [
]
target-version = "py313"

[tool.ruff.lint]
select = [
    # flake8
    "F",
    # pycodestyle
    "E",
    # flake8-bugbear
    "B",
    # pyupgrade
    "U",
    # isort
    "I",
    # pandas vet
    "PD",
    # tryceratops
    "TRY",
    # flake8-pytest-style
    "PT",
]
ignore = [
]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.flake8-pytest-style]
parametrize-names-type = "csv"

[tool.uv.sources]
pdf-splitter = { git = "https://github.com/runyaga/pdf-splitter.git" }
