[project]
name = "soliplex-monorepo"
version = "1.0.0"
description = "Soliplex Monorepo - AI-powered RAG system with document ingestion"
authors = [{ name = "Enfold", email = "info@enfoldsystems.net" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Common dependencies shared across apps
    "haiku-rag-slim >= 0.23.0",
    "docling-core >= 2.51.1",
    "pydantic-settings >= 2.12.0",
    "sqlmodel >= 0.0.27",
    "aiosqlite <0.22.0",
    "fastapi[standard] >= 0.125.0",
]

[tool.uv.workspace]
members = [
    "apps/soliplex",
    "apps/ingester",
    "apps/agents",
]

[tool.uv.sources]
soliplex = { workspace = true }
soliplex-ingester = { workspace = true }
"soliplex.agents" = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=7.0.0",
    "pytest-env>=1.0.0",
    "ruff>=0.14.0",
    "coverage>=7.0.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.6.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["F", "E", "B", "U", "I", "PD", "TRY", "PT"]

[tool.ruff.lint.isort]
force-single-line = true

# Root workspace is not a package itself - don't build it
[tool.setuptools]
packages = []
