services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: soliplex
      POSTGRES_PASSWORD: soliplex
      POSTGRES_DB: soliplex
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soliplex"]
      interval: 5s
      timeout: 3s
      retries: 5

  hermes:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8642:8642"
    volumes:
      - ${HERMES_DATA_PATH:-~/hermes-data}:/opt/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8642/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
