# a multi-database configuration.  Tool config in 'pyproject.toml'

[alembic]

# path to migration scripts.
# this is typically a path given in POSIX (e.g. forward slashes)
# format, relative to the token %(here)s which refers to the location of this
# ini file
script_location = %(here)s/alembic

# for multiple database configuration, new named sections are added
# which each include a distinct ``sqlalchemy.url`` entry.  A custom value
# ``databases`` is added which indicates a listing of the per-database
# sections.
# The ``databases`` entry as well as the URLs present in the ``[agui]``
# and ``[engine2]`` sections continue to be consumed by the user-maintained
# env.py script only.

# Our 'env.py' uses the Soliplex 'installation' object to find DBURis.
databases = agui, authz

#[agui]
#sqlalchemy.url = driver://user:pass@localhost/dbname

#[authz]
#sqlalchemy.url = driver://user:pass@localhost/dbname2

# Logging configuration.  This is also consumed by the user-maintained
# env.py script only.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
