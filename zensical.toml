[project]
site_name = "Soliplex"
site_url = "https://soliplex.github.io/soliplex/"
dev_addr = "127.0.0.1:8001"
repo_name = "soliplex/soliplex"
repo_url = "https://github.com/soliplex/soliplex"

nav = [
  { "Home" = "index.md" },
  { "Overview" = "overview.md" },
  { "Setup" = [
    { "Prerequisites" = "prerequisites.md" },
    { "Server" = [
      { "Overview" = "server/index.md" },
      { "CLI" = "server/cli.md" },
      { "Environment Variables" = "server/environment.md" },
      { "SSE Resume" = "server/sse_resume.md" },
    ]},
    { "Client" = "client.md" },
    { "Docker" = "docker.md" },
    { "RAG DB" = "rag.md" },
  ]},
  { "Configuration" = [
    { "Filesystem Layout" = "config/filesystem_layout.md" },
    { "Installation" = "config/installation.md" },
    { "Meta" = "config/meta.md" },
    { "Environment" = "config/environment.md" },
    { "Secrets" = "config/secrets.md" },
    { "Agents" = "config/agents.md" },
    { "Rooms" = "config/rooms.md" },
    { "Completions" = "config/completions.md" },
    { "RAG" = "config/rag.md" },
    { "Quizzes" = "config/quizzes.md" },
    { "OIDC Authentication" = "config/oidc_providers.md" },
    { "Logfire" = "config/logfire.md" },
    { "Console logging" = "config/logging.md" },
    { "SQLAlchemy DBURIs" = "config/dburis.md" },
    { "AI Skills" = "config/skills.md" },
    { "AGUI Features" = "config/agui.md" },
  ]},
  { "Usage" = "usage.md" },
]

# --------------------------------------------------------------------------
# Theme
# --------------------------------------------------------------------------
[project.theme]
logo = "img/logo.png"
language = "en"

features = [
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.path",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.share",
  "search.suggest",
  "toc.follow",
]

[project.theme.icon]
repo = "fontawesome/brands/github-alt"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "material/lightbulb-auto"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "deep purple"
accent = "amber"
toggle.icon = "material/lightbulb"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "deep purple"
accent = "amber"
toggle.icon = "material/lightbulb-outline"
toggle.name = "Switch to system preference"

# --------------------------------------------------------------------------
# Markdown extensions
# --------------------------------------------------------------------------
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
use_pygments = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.snippets]
[project.markdown_extensions.pymdownx.superfences]
