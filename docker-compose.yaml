services:

  # On Linux, set APP_UID/APP_GID in .env or your shell so that
  # container-written files match your host user:
  #
  #   APP_UID=$(id -u) APP_GID=$(id -g) docker compose up soliplex_dev
  #
  soliplex_backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - "5678:5678"
      - "8000:8000"
    env_file:
      - .env
    # Needed to run 'bubblewrap' sandbox
    privileged: true
    # XXX: Used this env to test the 'server_time' sandbox environment.
    environment:
      - TZ=Pacific/Auckland
    volumes:
      - ./src/soliplex:/app/src/soliplex
      - ./installation:/app/installation
      - ./db:/app/db
      - ./sandbox/workdirs:/app/sandbox/workdirs
      - ./documents:/app/documents
      - ./uploads:/app/uploads
      - ./tests:/app/tests
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - soliplex_net

  # If you want to test the soliplex frontend (https://github.com/soliplex/frontend)
  # Clone it into src/frontend and uncomment the "soliplex_frontend" service below.

  # soliplex_frontend:
  #   build:
  #     context: ./src/frontend
  #     dockerfile: Dockerfile
  #     target: dev
  #   ports:
  #     - "9000:9000"
  #   volumes:
  #     - ./src/frontend:/app
  #   networks:
  #     - soliplex_net

  # If you want to test the embeddable chat widget (https://github.com/soliplex/chatbot/)
  # Clone it into src/chatbot and uncomment "chatbot_builder", "chatbot_dev" and "chatbot_widget" services below.

  # chatbot_builder:
  #   build:
  #     context: ./src/chatbot
  #     dockerfile: Dockerfile
  #   ports:
  #     - "35729:35729"
  #   volumes:
  #     - ./src/chatbot:/app
  #     - /app/node_modules
  #   environment:
  #     - ESBUILD_POLL=true
  #   networks:
  #     - soliplex_net

  # chatbot_dev:
  #   build:
  #     context: ./src/chatbot
  #     dockerfile: Dockerfile
  #   command: npm run dev
  #   ports:
  #     - "3000:3000"
  #   volumes:
  #     - ./src/chatbot:/app
  #     - /app/node_modules
  #   environment:
  #     - WATCHPACK_POLLING=true
  #   networks:
  #     - soliplex_net

  # chatbot_widget:
  #   image: nginx:alpine
  #   ports:
  #     - "8080:80"
  #   volumes:
  #     - ./src/chatbot/public:/usr/share/nginx/html:ro
  #     - ./src/chatbot/nginx-widget.conf:/etc/nginx/conf.d/default.conf:ro
  #   depends_on:
  #     - chatbot_builder
  #   networks:
  #     - soliplex_net

networks:
  soliplex_net:
    driver: bridge
