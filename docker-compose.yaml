services:
  soliplex_web:
    build:
      context: ./src/flutter
      dockerfile: Dockerfile
    ports:
      - "9000:9000"
    networks:
      - soliplex_net

  soliplex_backend:
    build:
      context: .
      dockerfile: Dockerfile
    #network_mode: "host" # only works on linux
    ports:
      - "5678:5678"
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./src/soliplex:/app/src/soliplex
      - ./installation:/app/installation
      - ./db:/app/db
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - soliplex_net

networks:
  soliplex_net:
    driver: bridge