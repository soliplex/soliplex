id: "haiku"
name: "Haiku-RAG search"
description: "Search documents using Haiku-RAG"
suggestions:
- "What time is it?"
- "Who am I?"
- "What is a Soliplex installation?"
agent:
  system_prompt: "./prompt.txt"
  provider_type: "openai"
  model_name: "gpt-4o-mini"
  provider_base_url: "https://api.openai.com"
  provider_key: "secret:OPENAI_API_KEY"
allow_mcp: true
tools:
  - tool_name: "soliplex.tools.get_current_datetime"
    allow_mcp: true
  - tool_name: "soliplex.tools.get_current_user"
  - tool_name: "soliplex.tools.search_documents"
    rag_lancedb_stem: "rag"
    return_citations: true
    expand_context_radius: 3
    search_documents_limit: 7
    allow_mcp: true
