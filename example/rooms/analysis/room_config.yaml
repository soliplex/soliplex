id: "analysis"
name: "Analysis"
description: "Search and analyze documents with code execution"

suggestions:
  - "Analyze the data in the documents"
  - "Compare metrics across documents"

agent:
  template_id: "default_chat"

skills:
  skill_configs:
    # Analysis searches and cites as well as running code, so pairing it
    # with the RAG skill over the same corpus would give the model two
    # near-identical search tools, split its citations across the two
    # records, and give the question two search budgets to spend.
    - kind: "haiku.rag.skills.analysis"
      rag_lancedb_stem: "rag"

    # Compaction replaces earlier questions' evidence on the request with
    # what was cited; the citation policy is what makes citations happen.
    # Configuring compaction alone drops the evidence of any question the
    # model did not cite for.
    - kind: "haiku.rag.skills.evidence_compaction"
    - kind: "haiku.rag.skills.citation_policy"

allow_mcp: false
