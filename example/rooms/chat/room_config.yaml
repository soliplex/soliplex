id: "chat"
name: "Haiku Chat"
description: "Conversational RAG with search, ask, and document retrieval"

suggestions:
  - "Get the document agents.md and summarize its key points"
  - "Search for information about Soliplex"
  - "Explain how the authentication system works"

agent:
  template_id: "default_chat"
  system_prompt: |
    You are a helpful agent.

    Use the room's tools and skills to respond to the user's requests.

tools:
  - tool_name: "soliplex.tools.get_current_datetime"
  - tool_name: "soliplex.tools.get_current_user"
  - tool_name: "soliplex.tools.current_run_info"
  - tool_name: "soliplex.tools.file_uploads.list_thread_file_uploads"
  - tool_name: "soliplex.tools.file_uploads.get_thread_file_upload"

skills:
  skill_configs:
    - kind: "haiku.rag.skills.rag"
      rag_lancedb_stem: "rag"

    # Compaction replaces earlier questions' evidence on the request with
    # what was cited; the citation policy is what makes citations happen.
    # Configuring compaction alone drops the evidence of any question the
    # model did not cite for.
    - kind: "haiku.rag.skills.evidence_compaction"
    - kind: "haiku.rag.skills.citation_policy"

allow_mcp: true
