id: "hermes"
name: "Hermes Agent"
description: "Self-improving AI agent powered by Hermes — with tools, memory, and skills"

suggestions:
  - "Search the web for latest AI news"
  - "What time is it?"
  - "Create a simple Python script that prints fibonacci numbers"

agent:
  kind: hermes
  hermes_url: http://localhost:8643
  hermes_model: "MiniMax-M2.7"
  hermes_max_iterations: 10
  hermes_toolsets:
    - terminal
    - file
    - web
    - cronjob
    - skills
    - memory
    - vision
    - code_execution
    - todo
    - soliplex
  hermes_disabled_toolsets: []
  hermes_system_prompt: |
    When you need to run a shell command, use the "terminal" tool (not "process").
    The "terminal" tool executes one-shot commands and returns the output.
    The "process" tool is for managing background processes — avoid it for simple commands.
