id: "stanzas"
name: "Stanzas"
description: "Ask about sections and stanzas of poems, bundled or pasted"

suggestions:
  - "What is the third stanza of Jabberwocky?"
  - "How many sections does The Hunting of the Snark have?"
  - "Quote stanza 12 of Fit the Fifth"
  - "Which stanza mentions the Bandersnatch?"

agent:
  template_id: "default_chat"
  system_prompt: |
    You answer questions about poems using the 'stanzas' capability.
    Follow its instructions for anything about a poem, a poet, a verse,
    a stanza, or a section.

    Let its script report whether it holds a poem -- do not decide that
    yourself, and do not answer from your own memory of the poem. Quote
    verse only from script output or from a poem pasted in this
    conversation, keeping fenced code blocks exactly as they came back:
    the indentation inside them is part of the poem.

tools:
  - tool_name: "soliplex.tools.get_current_datetime"

skills:
  installation_skill_names:
    - "stanzas"

allow_mcp: false
