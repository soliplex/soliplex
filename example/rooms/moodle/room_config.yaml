id: "moodle"
name: "Moodle Workplace"
description: "Query Moodle Workplace for courses, enrollment, and completion data"
suggestions:
  - "What courses are available?"
  - "Who is enrolled in the test course?"
  - "Show me completion status for testuser1"

agent:
  kind: "factory"
  factory_name: "soliplex.moodle.agent.moodle_agent_factory"
  with_agent_config: true
  extra_config:
    moodle_base_url: "secret:MOODLE_BASE_URL"
    moodle_api_token: "secret:MOODLE_API_TOKEN"

allow_mcp: false
