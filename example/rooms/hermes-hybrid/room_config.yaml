id: "hermes-hybrid"
name: "Hybrid Agent"
description: "Full Soliplex + Hermes in one room — RAG, file uploads, web search, terminal, and 74 skills"

suggestions:
  - "Search our documents for information about authentication"
  - "Search the web for latest AI news"
  - "What time is it?"
  - "Research quantum computing and write a summary"
  - "List what Hermes tools are available"
  - "What tools and capabilities do you have?"

agent:
  template_id: "default_chat"
  system_prompt: |
    You are a powerful assistant with access to BOTH local document
    search (RAG) AND the Hermes agent for web search, terminal,
    code execution, and 74 specialized skills.

    Your Soliplex tools:
    - RAG search: search the local knowledge base for documents
    - File uploads: list and read files uploaded to this room
    - Current datetime: get the current time
    - Current user: get info about who you're talking to

    Your Hermes tools:
    - list_hermes_tools: discover available Hermes tools
    - hermes_tool: call a single Hermes tool directly
      (web_search, terminal, read_file, write_file, etc.)
    - run_hermes_task: delegate a complex multi-step task to Hermes
      (research, analysis, code writing — Hermes uses its own agent loop)

    Cross-room tools:
    - list_rooms: discover other rooms and their specializations
    - ask_room: send a message to another room's agent and get its response

    Guidelines:
    - For questions about our documents → use RAG search or ask_room("search", ...)
    - For current info from the web → use hermes_tool("web_search", ...)
    - For simple commands → use hermes_tool("terminal", ...)
    - For complex multi-step tasks → use run_hermes_task
    - For specialized analysis → use ask_room to delegate to the right room
    - For questions about this platform → refer to the soliplex-guide skill

tools:
  # Soliplex native tools
  - tool_name: "soliplex.tools.get_current_datetime"
  - tool_name: "soliplex.tools.get_current_user"
  - tool_name: "soliplex.tools.file_uploads.list_thread_file_uploads"
  - tool_name: "soliplex.tools.file_uploads.get_thread_file_upload"

  # Hermes agent tools
  - tool_name: "soliplex.tools.hermes.run_hermes_task"
  - tool_name: "soliplex.tools.hermes.hermes_tool"
  - tool_name: "soliplex.tools.hermes.list_hermes_tools"

  # Cross-room communication
  - tool_name: "soliplex.tools.rooms.ask_room"
  - tool_name: "soliplex.tools.rooms.list_rooms"

skills:
  installation_skill_names:
    - "soliplex-guide"
    - "soliplex-api"
    - "soliplex-agui"

  # RAG skill requires a seeded LanceDB — uncomment when db/rag/ exists:
  # skill_configs:
  #   - kind: "haiku.rag.skills.rag"
  #     rag_lancedb_stem: "rag"
