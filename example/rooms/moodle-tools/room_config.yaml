id: "moodle-tools"
name: "Moodle Workplace"
description: "Query and manage Moodle Workplace for courses, enrollment, completion, groups, grades, calendar, and messaging"
suggestions:
  - "What courses are available?"
  - "Who hasn't completed the Safety Fundamentals course?"
  - "What's in the Cyber Awareness course?"
  - "Show me upcoming training deadlines"
  - "What groups are in Course X?"
  - "What grades does testuser1 have?"
  - "What certifications exist in the system?"
  - "Who is allocated to the Workplace Safety Certification?"
  - "What programs are available?"
  - "What tenants exist?"
  - "What's in the Onboarding Program?"
  - "Show me Alice's learning catalogue"
  - "What departments exist?"
  - "Who is in the Engineering department?"
  - "What competency frameworks exist?"
  - "Create a new department called 'Security' under Engineering"
  - "Create a 'Team Lead' position with department manager permissions"
  - "What custom reports are available?"
  - "Show me the UTM report for Safety Fundamentals"
  - "Who hasn't completed Cybersecurity Basics in Engineering?"
  - "Archive the Onboarding Program"
  - "Duplicate the Leadership Track program"

agent:
  kind: "factory"
  factory_name: "soliplex.moodle.agent.moodle_tools_agent_factory"
  with_agent_config: true
  extra_config:
    moodle_base_url: "secret:MOODLE_BASE_URL"
    moodle_api_token: "secret:MOODLE_API_TOKEN"

# Compose additional haiku-skills alongside the built-in Moodle tools:
# skills:
#   installation_skill_names:
#     - "rag"

allow_mcp: false
