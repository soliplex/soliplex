id: "moodle-tools"
name: "Moodle Workplace"
description: "Query and manage Moodle Workplace for courses, enrollment, completion, groups, grades, calendar, and messaging"
suggestions:
  - "What courses are available?"
  - "Who hasn't completed the Safety Fundamentals course?"
  - "What's in the Cyber Awareness course?"
  - "Show me upcoming training deadlines"
  - "What groups are in Course X?"
  - "What grades does testuser1 have?"

agent:
  kind: "factory"
  factory_name: "soliplex.moodle.agent.moodle_tools_agent_factory"
  with_agent_config: true
  extra_config:
    moodle_base_url: "secret:MOODLE_BASE_URL"
    moodle_api_token: "secret:MOODLE_API_TOKEN"

allow_mcp: false
