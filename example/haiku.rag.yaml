# haiku.rag configuration file
# See https://ggozad.github.io/haiku.rag/configuration/ for details

environment: development

storage:
  data_dir: ""
  auto_vacuum: true
  vacuum_retention_seconds: 86400

# Every database is named here, and its location is a local path or a
# URI.  Leave the section out to use the default local database.  The
# name is what results and citations carry, and what a room reports as
# 'database'; the location stays here.
#lancedb:
#  databases:
#    papers: /path/to/papers.lancedb

# Configure LanceDB Cloud
#lancedb:
#  databases:
#    papers: db://your-database-name
#  api_key: ''
#  region: ''

# Configure Amazon S3
# Use AWS credentials or IAM roles
#lancedb:
#  databases:
#    papers: s3://my-bucket/papers.lancedb
#  storage_options:
#    region: us-east-1

# Configure Azure Blob Storage
# Use Azure credentials
#lancedb:
#  databases:
#    papers: az://my-bucket/papers.lancedb

# Google Cloud Storage
# Use GCP credentials
#lancedb:
#  databases:
#    papers: gs://my-bucket/papers.lancedb

# Configure Hadoop file system
#lancedb:
#  databases:
#    papers: hdfs://namenode:port/path/to/papers.lancedb

embeddings:
  model:
    name: qwen3-embedding:4b
    provider: ollama
    vector_dim: 2560
    #
    #  Point at a vLLM endpoint with the 'vllm' provider and its
    #  OpenAI-compatible URL, in place of the two lines above:
    #
    #  provider: vllm
    #  base_url: http://localhost:11438/v1

# Omit the 'reranking' section to disable re-ranking, or set 'model: null'.
#reranking:
#  model:
#    name: BAAI/bge-reranker-v2-m3
#    provider: vllm
#    base_url: http://localhost:11439/v1

qa:
  model:
    name: gpt-oss:latest
    provider: ollama
    #
    #  vLLM serves an OpenAI-compatible API, so a vLLM-hosted QA model uses
    #  the 'openai' provider with its URL:
    #
    #  provider: openai
    #  base_url: http://localhost:11432/v1

processing:
  chunk_size: 256
  converter: docling-serve  # Use remote conversion
  chunker: docling-serve    # Use remote chunking

#search:
#  limit: 10
#  max_context_chars: 10000
#  vector_index_metric: cosine
#  vector_refine_factor: 30

providers:
  # The docling-serve url if you have not installed the full haiku.rag package.
  docling_serve:
    base_url: http://localhost:5001

  #
  #  Leave the 'ollama' section commented out to allow it's base URL to be
  #  populated from 'os.environ' when using the 'haiku-rag' CLI.
  #
  #  In the soliplex server, this value will be replaced by the value
  #  configured for 'OLLAMA_BASE_URL' in the installation environment (if set).
  #
  #  ollama:
  #   base_url: http://localhost:11434
