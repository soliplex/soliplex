repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version matching your devenv setup
    rev: v0.15.10
    hooks:
      - id: ruff-check
        types: [python]
      - id: ruff-format
        types: [python]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0 # Use the latest stable version
    hooks:
      - id: no-commit-to-branch
        args: ["--branch", "main", "--branch", "master"]
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: pip-audit
        name: pip-audit
        entry: uv run --with pip-audit pip-audit --skip-editable
        language: system
        pass_filenames: false
        files: (^pyproject\.toml$|^uv\.lock|^.pre-commit-config.yaml$)
      - id: agentskills-validate
        name: agentskills validate
        entry: uv run --group dev agentskills validate skills/soliplex-docs
        language: system
        pass_filenames: false
        files: ^skills/soliplex-docs/
      - id: lint-textio
        name: lint text IO encoding
        entry: uv run python scripts/lint_textio.py --verbose
        language: system
        types: [python]
        # 'src/' only: the test suite's own call sites are a separate
        # cleanup, and its fixtures are not UTF-8 by specification.
        files: ^src/soliplex/
      - id: lint-textio-self-test
        name: lint text IO encoding (self-test)
        entry: uv run python scripts/lint_textio.py --self-test
        language: system
        pass_filenames: false
        files: ^scripts/lint_textio\.py$

  - repo: https://github.com/jackdewinter/pymarkdown
    rev: v0.9.36
    hooks:
      - id: pymarkdown
        args:
          - "scan"
        # The 'stanzas' poem files are verbatim source texts, not prose we
        # own: the skill's whole promise is byte-exact quoting, so their
        # whitespace must not be reflowed to satisfy markdown rules.
        exclude: |
          (?x)^(
            ios/Runner/Assets\.xcassets/
            |example/skills/stanzas/resources/
          )

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint
