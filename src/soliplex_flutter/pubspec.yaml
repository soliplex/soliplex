name: soliplex_flutter
description: 'Soliplex Flutter Client - AI-powered RAG interface'
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0-200.1.beta

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # HTTP client (pure Dart, no dio)
  http: ^1.2.2

  # Local persistence (no hive)
  shared_preferences: ^2.3.3

  # AG-UI protocol
  ag_ui:
    git:
      url: https://github.com/soliplex/ag-ui.git
      path: sdks/community/dart

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting
  flutter_lints: ^6.0.0

  # Pure Dart testing
  test: ^1.25.8

  # Mocking
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
