[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "soliplex-skill-{{ cookiecutter.name }}"
version = "0.1.0"
description = "{{ cookiecutter.description }}"
requires-python = ">=3.12"
dependencies = [
    "haiku.rag-slim >= 0.34.0, < 0.35",
    "haiku-skills >= 0.9.0, < 0.10",
]

[project.entry-points."haiku_skills"]
{{ cookiecutter.name }} = "soliplex_skill_{{ cookiecutter.name }}:create_skill"
