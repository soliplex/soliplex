# devenv-local haiku.rag configuration

environment: development

storage:
  data_dir: ""
  auto_vacuum: true
  vacuum_retention_seconds: 86400

monitor:
  directories: ["docs"]
  ignore_patterns: ["*.png"]
  include_patterns: ["*.md"]

embeddings:
  model:
    name: qwen3-embedding:4b
    provider: ollama
    vector_dim: 2560

qa:
  model:
    name: gpt-oss:latest
    provider: ollama

research:
  model:
    name: gpt-oss:latest
    provider: ollama
  max_iterations: 2
  max_concurrency: 1

processing:
  chunk_size: 256
  converter: docling-serve
  chunker: docling-serve

providers:
  docling_serve:
    base_url: http://localhost:5001

  ollama:
    base_url: http://localhost:11434

  vllm:
    embeddings_base_url: ""
    rerank_base_url: ""
    qa_base_url: ""
    research_base_url: ""
