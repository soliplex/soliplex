name: Deploy Site (Docs + WebApp)

on:
  push:
    branches: [main]
    paths:
      - 'mkdocs.yml'
      - 'docs/**'
      - 'apps/flutter-ui/**'
      - '.github/workflows/deploy-site.yml'

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build Documentation
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Install MkDocs Material
        run: pip install mkdocs-material

      - name: Build Docs
        run: mkdocs build

      # Build Flutter Web App
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'beta'
          cache: true

      - name: Install Flutter dependencies
        working-directory: apps/flutter-ui
        run: flutter pub get

      - name: Build Flutter Web
        working-directory: apps/flutter-ui
        run: flutter build web --release --base-href /soliplex/webapp/ --no-tree-shake-icons

      # Combine and Deploy
      - name: Merge Web App into Site
        run: |
          mkdir -p site/webapp
          cp -a apps/flutter-ui/build/web/. site/webapp/
          touch site/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
