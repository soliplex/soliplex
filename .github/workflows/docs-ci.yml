name: Docs CI

on:
  pull_request:
    paths:
      - 'mkdocs.yml'
      - 'docs/**'
      - 'scripts/**'
      - 'src/flutter/lib/**'
      - '.github/workflows/docs-ci.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install Python dependencies
        run: uv sync

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'beta'
          cache: true

      - name: Install Flutter dependencies
        working-directory: src/flutter
        run: flutter pub get

      - name: Install dart_doc_markdown
        run: dart pub global activate dart_doc_markdown

      - name: Generate Dart API Docs
        run: ./scripts/generate_dart_markdown.sh

      - name: Generate Client API Index
        run: uv run python scripts/generate_client_api_index.py

      - name: Build MkDocs Site
        run: uv run mkdocs build

      - name: Validate Federation
        run: uv run python scripts/validate_llms_strategy.py

      - name: Run Script Tests
        run: uv run pytest tests/unit/scripts/ -v --no-cov
