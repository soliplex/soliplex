name: Docs CI

on:
  pull_request:
    paths:
      - 'mkdocs.yml'
      - 'docs/**'
      - 'scripts/**'
      - 'src/flutter/lib/**'
      - '.github/workflows/docs-ci.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'beta'
          cache: true

      - name: Install Flutter dependencies
        working-directory: src/flutter
        run: flutter pub get

      - name: Build and Validate Docs
        run: ./scripts/build_docs.sh

      - name: Run Script Tests
        run: uv run pytest tests/unit/scripts/ -v --no-cov
