name: Python linting

on:
  push:
    branches:
      - main
    paths:
      - 'pyproject.toml'
      - 'src/soliplex/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/python-lint.yaml'
      - 'uv.lock'
  pull_request:
    branches:
      - main
    paths:
      - 'pyproject.toml'
      - 'src/soliplex/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/python-lint.yaml'
      - 'uv.lock'
  workflow_dispatch:

jobs:
  lint-soliplex:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Check formatting
        run: |
          set -o pipefail
          uv run ruff format --check 2>&1 | tee ruff-format.log

      - name: Run ruff linter
        run: |
          set -o pipefail
          uv run ruff check 2>&1 | tee ruff-check.log

      # 'ruff PLW1514' covers only the 'open()' form, not the 'pathlib'
      # 'read_text()' / 'write_text()' helpers; this catches all three.
      # The self-test runs first, so a check gone blind fails loudly
      # rather than passing by finding nothing.
      - name: Check text IO encoding
        run: |
          set -o pipefail
          uv run python scripts/lint_textio.py --self-test 2>&1 \
            | tee lint-textio.log
          uv run python scripts/lint_textio.py --verbose 2>&1 \
            | tee -a lint-textio.log

      # A field's interpolation contract is declared on the field; this
      # rejects a property which resolves markers by hand, leaving the
      # field invisible to 'soliplex-cli audit'.
      - name: Check ad-hoc interpolation
        run: |
          set -o pipefail
          uv run python scripts/lint_interpolation.py --self-test 2>&1 \
            | tee lint-interpolation.log
          uv run python scripts/lint_interpolation.py --verbose 2>&1 \
            | tee -a lint-interpolation.log

      # Ensure that the alembic migration chain reproduces the models exactly.
      # The self-test runs # first, stopping one revision short of head,
      # where the comparison # must report a difference.
      - name: Check migration chain matches the models
        run: |
          set -o pipefail
          uv run python scripts/lint_alembic_chain.py --self-test 2>&1 \
            | tee lint-alembic-chain.log
          uv run python scripts/lint_alembic_chain.py --verbose 2>&1 \
            | tee -a lint-alembic-chain.log

      # Downstream projects depend on the 'postgres' / 'postgres-binary'
      # extras, and no unit test needs a driver, so nothing else notices
      # one of them breaking, or a driver becoming a hard dependency.
      - name: Check PostgreSQL drivers stay optional
        run: |
          set -o pipefail
          uv run python scripts/lint_postgres_drivers.py --self-test 2>&1 \
            | tee lint-postgres-drivers.log
          uv run python scripts/lint_postgres_drivers.py --verbose 2>&1 \
            | tee -a lint-postgres-drivers.log

      # Slack notification lives in 'ci-failure-notify.yaml', which only
      # links to this run (see #1203), so record what failed here.
      - name: Summarize failures
        if: failure()
        run: |
          {
            echo "## Linting failed"
            echo
            for log in ruff-format.log ruff-check.log lint-textio.log \
                       lint-interpolation.log lint-alembic-chain.log \
                       lint-postgres-drivers.log; do
              [ -f "$log" ] || continue
              echo "<details><summary>$log</summary>"
              echo
              echo '```'
              tail -n 100 "$log"
              echo '```'
              echo
              echo "</details>"
              echo
            done
          } >> "$GITHUB_STEP_SUMMARY"
