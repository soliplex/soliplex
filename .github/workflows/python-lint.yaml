name: Python linting

on:
  push:
    branches:
      - main
    paths:
      - 'pyproject.toml'
      - 'src/soliplex/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/python-lint.yaml'
      - 'uv.lock'
  pull_request:
    branches:
      - main
    paths:
      - 'pyproject.toml'
      - 'src/soliplex/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/python-lint.yaml'
      - 'uv.lock'
  workflow_dispatch:

jobs:
  lint-soliplex:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Check formatting
        run: uv run ruff format --check

      - name: Run ruff linter
        run: uv run ruff check

      # 'ruff PLW1514' covers only the 'open()' form, not the 'pathlib'
      # 'read_text()' / 'write_text()' helpers; this catches all three.
      # The self-test runs first, so a check gone blind fails loudly
      # rather than passing by finding nothing.
      - name: Check text IO encoding
        run: |
          set -o pipefail
          uv run python scripts/lint_textio.py --self-test 2>&1 \
            | tee lint-textio.log
          uv run python scripts/lint_textio.py --verbose 2>&1 \
            | tee -a lint-textio.log

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v3
        with:
          webhook: ${{ secrets.SLACK_NOTIFY_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "channel": "#soliplex",
              "username": "soliplex",
              "text": ":x: ${{ github.workflow }} failed on ${{ github.head_ref }}:\n${{ github.event.head_commit.message }}\nhttps://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "icon_emoji": ":ghost:"
            }
