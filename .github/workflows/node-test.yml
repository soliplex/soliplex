name: Node/Svelte Tests

on:
  push:
    branches: [main]
    paths:
      - 'apps/ingester-ui/**'
      - '.github/workflows/node-test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/ingester-ui/**'
      - '.github/workflows/node-test.yml'

defaults:
  run:
    working-directory: apps/ingester-ui

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/ingester-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run check

      - name: Run linter
        run: npm run lint

      - name: Build
        run: npm run build
