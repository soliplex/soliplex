name: Build & publish docs skill

# Generates a filesystem Agent Skill (https://agentskills.io/) from the
# 'docs/' tree and publishes it. No embeddings, vector database, or GPU are
# involved -- the skill is plain Markdown the agent reads on demand, so this
# runs in well under a minute.
#
# Publishing has two modes:
#
# * On a software release ('release: published'): the skill snapshot is
#   attached to that release, pinned to the released version.
# * On docs changes to main (and manual dispatch): an immutable rolling
#   build 'docs-YYYY.MM.DD-<sha>' is published, the 'docs-latest' pointer is
#   updated to it, and old rolling builds are pruned.

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'zensical.toml'
      - 'scripts/generate_docs_skill.py'
      - 'skills/soliplex-docs/**'
      - '.github/workflows/build-docs-skill.yaml'
  workflow_dispatch:

# Serialize publishes so concurrent runs do not race on the rolling pointer
# or the prune step.
concurrency:
  group: build-docs-skill
  cancel-in-progress: false

env:
  ASSET_TARBALL: soliplex-docs-skill.tar.gz
  ASSET_ZIP: soliplex-docs-skill.zip
  POINTER_TAG: docs-latest
  KEEP_ROLLING: "10"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      # The 'dev' group installs 'soliplex-skills' (which depends on
      # 'skills-ref'), used by the generator to validate the skill against
      # the Agent Skills spec.
      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Generate docs skill
        run: >
          uv run --group dev python scripts/generate_docs_skill.py
          --out dist --commit ${{ github.sha }}

      - name: Package docs skill
        run: |
          tar czf "$ASSET_TARBALL" -C dist soliplex-docs
          (cd dist && zip -qr "../$ASSET_ZIP" soliplex-docs)

      - name: Compute build identity
        run: |
          {
            echo "SHORT_SHA=${GITHUB_SHA::7}"
            echo "GEN_DATE=$(date -u +%Y-%m-%d)"
            echo "ROLLING_TAG=docs-$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}"
            echo "SHA256=$(sha256sum "$ASSET_TARBALL" | cut -d' ' -f1)"
          } >> "$GITHUB_ENV"

      # version.json identifies a published build so consumers can detect
      # drift and verify the download. Written for whichever tag we publish.
      - name: Write version manifest
        env:
          TARGET_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || env.ROLLING_TAG }}
        run: |
          jq -n \
            --arg tag "$TARGET_TAG" \
            --arg commit "$SHORT_SHA" \
            --arg generated "$GEN_DATE" \
            --arg sha256 "$SHA256" \
            --arg url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TARGET_TAG}/${ASSET_TARBALL}" \
            '{tag:$tag, source_commit:$commit, generated:$generated, sha256:$sha256, asset_url:$url}' \
            > version.json
          cat version.json

      # --- Software-release mode -------------------------------------------
      - name: Attach skill to software release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: >
          gh release upload "$TAG"
          "$ASSET_TARBALL" "$ASSET_ZIP" version.json --clobber

      # --- Rolling mode ----------------------------------------------------
      - name: Publish immutable rolling build
        if: github.event_name != 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$ROLLING_TAG" >/dev/null 2>&1 || \
            gh release create "$ROLLING_TAG" \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "Docs skill $ROLLING_TAG" \
              --notes "Rolling docs Agent Skill built from ${GITHUB_SHA}."
          gh release upload "$ROLLING_TAG" \
            "$ASSET_TARBALL" "$ASSET_ZIP" version.json --clobber

      - name: Update 'latest' pointer
        if: github.event_name != 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$POINTER_TAG" >/dev/null 2>&1 || \
            gh release create "$POINTER_TAG" \
              --prerelease \
              --title "Docs skill (latest)" \
              --notes "Rolling pointer to the newest docs Agent Skill build."
          # latest.json points at the immutable build; the tarball/zip are
          # re-hosted here too so the pointer URL is a one-request download.
          cp version.json latest.json
          gh release upload "$POINTER_TAG" \
            latest.json "$ASSET_TARBALL" "$ASSET_ZIP" --clobber

      - name: Prune old rolling builds
        if: github.event_name != 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --limit 200 --json tagName --jq '.[].tagName' \
            | grep -E '^docs-[0-9]{4}\.' \
            | sort -r \
            | tail -n +$((KEEP_ROLLING + 1)) \
            | while read -r tag; do
                echo "Pruning $tag"
                gh release delete "$tag" --cleanup-tag --yes
              done

      - name: Upload workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: soliplex-docs-skill
          path: |
            soliplex-docs-skill.tar.gz
            soliplex-docs-skill.zip
            version.json
          retention-days: 7

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v2.1.0
        with:
          webhook: ${{ secrets.SLACK_NOTIFY_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "channel": "#soliplex",
              "username": "soliplex",
              "text": ":x: ${{ github.workflow }} failed:\nhttps://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "icon_emoji": ":ghost:"
            }
